services:
  - type: web
    name: io-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        sync: false # MongoDB Atlas connection string — set in Render dashboard
      - key: MONGO_DB
        value: io
      - key: CORS_ORIGINS
        sync: false # comma-separated frontend origin(s), e.g. https://io-app.vercel.app
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret — do not reuse the dev default
      - key: OPENPROJECT_BASE_URL
        value: https://op.flynava.ai
      - key: OPENPROJECT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
